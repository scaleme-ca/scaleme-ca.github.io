<style>
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:200 800;font-stretch:75% 100%;font-display:swap;src:url(/fonts/bricolage-grotesque-var.woff2) format('woff2-variations');}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:100 1000;font-display:swap;src:url(/fonts/dm-sans-var.woff2) format('woff2-variations');}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/dm-mono-400.woff2) format('woff2');}
@font-face{font-family:'DM Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/fonts/dm-mono-500.woff2) format('woff2');}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --paper:#EDE9DE;--white:#FFFFFF;--ink:#111110;--ink-2:#4E4C44;
  --pink:#FF2E88;--aqua:#00B3A6;--sun:#FFC400;--bw:3px;
  --disp:'Bricolage Grotesque','Archivo','Helvetica Neue',sans-serif;
  --body:'DM Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
}
html{scroll-behavior:smooth;}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:inherit;} ul{list-style:none;}
:focus-visible{outline:var(--bw) solid var(--ink);outline-offset:3px;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
.d{font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 84,'opsz' 48;letter-spacing:-.025em;line-height:1.03;}
.skip{position:absolute;left:-9999px;}
.skip:focus{left:12px;top:12px;z-index:999;background:var(--ink);color:var(--paper);padding:12px 18px;font-family:var(--mono);}
.in{max-width:1140px;margin:0 auto;}

.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-variation-settings:'wdth' 86;font-size:1rem;letter-spacing:-.015em;padding:15px 28px;border:var(--bw) solid var(--ink);background:var(--white);color:var(--ink);box-shadow:6px 6px 0 var(--ink);cursor:pointer;text-decoration:none;transition:transform .09s ease,box-shadow .09s ease;}
.btn:hover{transform:translate(-3px,-3px);box-shadow:10px 10px 0 var(--ink);}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
.btn--sun{background:var(--sun);}
.btn--pink{background:var(--pink);color:var(--ink);}
.mark{font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 84;font-size:1.14rem;letter-spacing:-.045em;text-decoration:none;display:inline-flex;align-items:center;gap:9px;}
.mark i{width:14px;height:14px;background:var(--pink);border:2px solid var(--ink);display:block;}
.open{background:var(--pink);border-bottom:var(--bw) solid var(--ink);padding:66px 34px 58px;}
.open h1{font-size:clamp(2.1rem,5vw,3.8rem);max-width:16ch;}
.open p{font-size:1.12rem;max-width:52ch;margin-top:20px;font-weight:500;}

.sec{border-bottom:var(--bw) solid var(--ink);padding:60px 34px 58px;}



.narrow{max-width:660px;}
.form__to{display:grid;grid-template-columns:64px 1fr;align-items:stretch;border:2px solid var(--ink);background:var(--paper);margin-bottom:4px;}
.form__to-l{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;}
.form__to-v{font-family:var(--mono);font-size:.95rem;padding:12px 14px;}
.form{background:var(--white);border:var(--bw) solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:30px 28px 28px;display:flex;flex-direction:column;gap:17px;}
.f{display:flex;flex-direction:column;gap:7px;}
.f--row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.f label{font-family:var(--mono);font-size:.66rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;}
.f input,.f select,.f textarea{font-family:var(--body);font-size:1rem;color:var(--ink);border:2px solid var(--ink);background:var(--paper);padding:11px 12px;width:100%;border-radius:0;}
.f textarea{resize:vertical;min-height:120px;}
.f select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;}
.f input:focus,.f select:focus,.f textarea:focus{background:var(--white);outline:var(--bw) solid var(--sun);outline-offset:0;}
.form__go{align-self:flex-start;margin-top:4px;}
.form__note{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--ink-2);}

.band{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;padding:20px 34px;font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;}
.band a{color:var(--ink-2);text-decoration:none;}
.band a:hover{color:var(--ink);background:var(--sun);}
.band__set{display:flex;gap:16px;flex-wrap:wrap;}


@media(max-width:640px){
  .nav,.open,.sec,.band{padding-left:20px;padding-right:20px;}
  .open{padding-top:46px;padding-bottom:42px;}
  .f--row{grid-template-columns:1fr;}
}

/* ===== canonical site nav (shared across all pages) ===== */
.nav{position:sticky;top:0;z-index:200;background:var(--paper);border-bottom:var(--bw) solid var(--ink);display:flex;align-items:stretch;min-height:58px;padding:0;gap:0;flex-wrap:nowrap;}
.nav__brand{display:flex;align-items:center;gap:10px;padding:0 24px;background:var(--ink);color:var(--paper);font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 84;font-size:1.1rem;letter-spacing:-.045em;text-decoration:none;white-space:nowrap;}
.nav__brand i{width:13px;height:13px;background:var(--pink);border:2px solid var(--paper);display:block;flex:none;}
.nav__links{display:flex;align-items:stretch;margin-left:auto;}
.nav__links a{display:flex;align-items:center;padding:0 18px;border-left:var(--bw) solid var(--ink);font-family:var(--mono);font-size:.73rem;font-weight:500;text-transform:uppercase;letter-spacing:.07em;text-decoration:none;color:var(--ink);white-space:nowrap;transition:background .1s,color .1s;}
.nav__links a:hover{background:var(--ink);color:var(--paper);}
.nav__links a[aria-current="page"]{background:var(--sun);}
.nav__q{display:flex;align-items:center;padding:0 18px;border-left:var(--bw) solid var(--ink);background:var(--pink);color:var(--ink);font-family:var(--disp);font-weight:700;font-variation-settings:'wdth' 86;font-size:.95rem;letter-spacing:-.015em;text-decoration:none;white-space:nowrap;box-shadow:none;transition:background .1s,color .1s;}
.nav__q:hover{background:var(--sun);color:var(--ink);}
.nav__toggle{display:none;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:58px;min-height:58px;padding:0;background:var(--paper);border:0;border-left:var(--bw) solid var(--ink);cursor:pointer;}
.nav__toggle span{display:block;width:24px;height:3px;background:var(--ink);transition:transform .15s ease,opacity .15s ease;}
.nav[data-open="true"] .nav__toggle span:nth-child(1){transform:translateY(8px) rotate(45deg);}
.nav[data-open="true"] .nav__toggle span:nth-child(2){opacity:0;}
.nav[data-open="true"] .nav__toggle span:nth-child(3){transform:translateY(-8px) rotate(-45deg);}

@media(max-width:1080px){
  .nav__links a{padding:0 13px;font-size:.68rem;letter-spacing:.05em;}
  .nav__q{padding:0 15px;font-size:.9rem;}
  .nav__brand{padding:0 18px;font-size:1rem;}
}
@media(max-width:900px){
  .nav{flex-wrap:wrap;padding:0;}
  .nav__brand{order:1;font-size:1rem;padding:0 16px;min-height:58px;}
  .nav__q{order:2;font-size:.9rem;padding:0 16px;min-height:58px;}
  .nav__toggle{order:3;display:flex;}
  .nav__links{order:4;display:none;flex-direction:column;align-items:stretch;width:100%;margin-left:0;border-top:var(--bw) solid var(--ink);}
  .nav[data-open="true"] .nav__links{display:flex;}
  .nav__links a{border-left:0;border-bottom:var(--bw) solid var(--ink);min-height:52px;padding:0 20px;font-size:.8rem;letter-spacing:.07em;}
  .nav__links a:last-child{border-bottom:0;}
}
@media(max-width:380px){
  .nav__brand{padding:0 12px;font-size:.92rem;}
  .nav__q{padding:0 12px;font-size:.82rem;}
  .nav__toggle{width:50px;}
}

/* ===== shared mobile polish ===== */
@media(max-width:900px){
  .band{gap:14px 20px;padding-top:14px;padding-bottom:18px;}
  .band a{display:inline-flex;align-items:center;min-height:44px;}
  .band__set{gap:2px 18px;}
}
@media(max-width:640px){
  .spec{grid-template-columns:repeat(2,minmax(0,1fr));}
  .spec__v,.spec__l{overflow-wrap:break-word;}
  .spec__b{padding-left:14px;padding-right:14px;}
}
@media(max-width:400px){
  .spec{grid-template-columns:minmax(0,1fr);}
}

/* form: spam honeypot + inline status */
.hp{position:absolute!important;left:-9999px!important;width:1px!important;height:1px!important;opacity:0!important;pointer-events:none;}
.form__status{font-family:var(--mono);font-size:.72rem;line-height:1.5;letter-spacing:.03em;border:2px solid var(--ink);padding:11px 13px;}
.form__status--ok{background:var(--aqua);}
.form__status--bad{background:var(--sun);}

/* ===== footer quote button + shared page CTA ===== */
.band .band__q{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;background:var(--pink);color:var(--ink);border:var(--bw) solid var(--ink);font-family:var(--disp);font-weight:700;font-variation-settings:'wdth' 86;font-size:.95rem;letter-spacing:-.015em;text-transform:none;text-decoration:none;transition:background .1s,color .1s;}
.band .band__q:hover{background:var(--sun);color:var(--ink);}
.cta{display:inline-block;margin-top:8px;font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 84;font-size:clamp(1.25rem,2.8vw,1.9rem);letter-spacing:-.035em;color:var(--ink);text-decoration:none;background:var(--sun);border:var(--bw) solid var(--ink);padding:9px 16px;transition:background .1s,color .1s;}
.cta:hover{background:var(--ink);color:var(--sun);}

/* footer wordmark: identical on every page */
.band .mark{display:inline-flex;align-items:center;gap:9px;font-family:var(--disp);font-weight:800;font-variation-settings:'wdth' 84;font-size:1.14rem;letter-spacing:-.045em;text-transform:none;text-decoration:none;color:var(--ink);}
.band .mark i{width:14px;height:14px;background:var(--pink);border:2px solid var(--ink);display:block;flex:none;}

/* ===== mobile nav: CTA fills the space between brand and toggle ===== */
@media(max-width:900px){
  .nav__q{order:2;flex:1 1 auto;margin-left:0;justify-content:center;text-align:center;}
  .nav__brand{flex:0 0 auto;}
  .nav__toggle{flex:0 0 auto;}
}
@media(max-width:420px){
  .nav__brand{padding-left:14px;padding-right:12px;font-size:1.02rem;}
  .nav__q{padding:0 8px;font-size:.86rem;}
}

/* skip link: off-screen until focused, then a real 44px target */
.skip:focus{position:fixed;left:12px;top:12px;z-index:999;display:inline-flex;align-items:center;min-height:44px;padding:0 16px;background:var(--sun);color:var(--ink);border:var(--bw) solid var(--ink);font-family:var(--mono);font-size:.8rem;text-decoration:none;}
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "ContactPage",
      "@id": "https://www.scaleme.ca/contact.html#page",
      "url": "https://www.scaleme.ca/contact.html",
      "name": "Get a quote for web design or marketing | ScaleMe",
      "isPartOf": {
        "@id": "https://www.scaleme.ca/#site"
      },
      "about": {
        "@id": "https://www.scaleme.ca/#org"
      },

    }
  ]
}
</script>

<body>

<a href="#main" class="skip">Skip to content</a>

<nav class="nav" id="sitenav">
  <a href="index.html" class="nav__brand"><i></i>SCALEME</a>
  <span class="nav__links" id="navlinks">
    <a href="web-design.html">Web design</a>
    <a href="marketing.html">Marketing</a>
    <a href="automation.html">Automation</a>
    <a href="affiliate.html">Affiliate</a>
  </span>
  <a href="contact.html" class="nav__q" aria-current="page">Get a quote</a>
  <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="navlinks" aria-label="Open menu"><span></span><span></span><span></span></button>
</nav>

<main id="main">

<section class="open">
  <div class="in">
    <h1 class="d">Tell us what you are trying to grow.</h1>
    <p>You get a reply within two working days, whether or not there is a job in it for us.</p>
  </div>
</section>

<section class="sec">
  <div class="in narrow">
    <form class="form" id="quoteform" method="POST"
          action="https://formspree.io/f/xnjeoeql">
      <div class="form__to">
        <span class="form__to-l">To</span>
        <span class="form__to-v">hello@scaleme.ca</span>
      </div>
      <input type="hidden" name="_subject" value="New quote request from scaleme.ca">
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="hp">
      <div class="f--row">
        <span class="f"><label for="name">Your name</label><input id="name" name="name" type="text" required></span>
        <span class="f"><label for="email">Email</label><input id="email" name="email" type="email" required></span>
      </div>
      <div class="f">
        <label for="site">Website, if you have one</label>
        <input id="site" name="website" type="text" placeholder="yourcompany.com">
      </div>
      <div class="f">
        <label for="need">What do you need</label>
        <select id="need" name="need">
          <option>Not sure yet</option>
          <option>Web design</option>
          <option>Marketing</option>
          <option>Automation</option>
          <option>Affiliate programs</option>
          <option>More than one of these</option>
        </select>
      </div>
      <div class="f">
        <label for="budget">Rough budget, if you have one in mind</label>
        <input id="budget" name="budget" type="text" placeholder="Happy to say later">
      </div>
      <div class="f">
        <label for="msg">What are you trying to grow</label>
        <textarea id="msg" name="message" required placeholder="What you sell, who buys it, and what is slow or missing right now."></textarea>
      </div>
      <p class="form__status" id="formstatus" role="status" aria-live="polite" hidden></p>
      <button type="submit" class="btn btn--sun form__go">Send it over</button>
    </form>
  </div>
</section>

</main>

<footer class="band">
  <a href="index.html" class="mark"><i></i>SCALEME</a>
  <span class="band__set">
    <a href="web-design.html">Web design</a>
    <a href="marketing.html">Marketing</a>
    <a href="automation.html">Automation</a>
    <a href="affiliate.html">Affiliate</a>
  </span>
  <a href="contact.html" class="band__q">Get a quote</a>
</footer>


<script>
(function(){
  var nav=document.getElementById('sitenav');
  if(!nav)return;
  var btn=nav.querySelector('.nav__toggle');
  if(!btn)return;
  function set(open){
    nav.setAttribute('data-open',open?'true':'false');
    btn.setAttribute('aria-expanded',open?'true':'false');
  }
  set(false);
  btn.addEventListener('click',function(){
    set(nav.getAttribute('data-open')!=='true');
  });
  document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false);});
  window.addEventListener('resize',function(){if(window.innerWidth>900)set(false);});
})();
</script>


<script>
(function(){
  var form=document.getElementById('quoteform');
  if(!form)return;
  var status=document.getElementById('formstatus');
  var btn=form.querySelector('button[type="submit"]');
  function say(msg,ok){
    status.hidden=false;
    status.textContent=msg;
    status.className='form__status '+(ok?'form__status--ok':'form__status--bad');
  }
  form.addEventListener('submit',function(e){
    e.preventDefault();
    var label=btn.textContent;
    btn.disabled=true;btn.textContent='Sending...';
    fetch(form.action,{method:'POST',body:new FormData(form),
      headers:{'Accept':'application/json'}}).then(function(r){
      if(r.ok){form.reset();say('Thanks, that came through. We will reply within two working days.',true);}
      else{return r.json().then(function(d){
        say((d.errors&&d.errors.map(function(x){return x.message;}).join(', '))||
            'Something went wrong. Please email us instead.',false);});}
    }).catch(function(){
      say('Could not send just now. Please check your connection or email us instead.',false);
    }).then(function(){btn.disabled=false;btn.textContent=label;});
  });
})();
</script>

</body>
